<title>StoryVerse Admin Prototype</title>
<meta name="description" content="Clickable static prototype of the story-fe admin console — login, dashboard, review queue, reports, stories." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /*
   * story-fe-prj/prototype.html
   * ---------------------------
   * The single clickable static mirror of the admin console (React 18 +
   * Ant Design 5). One file, every screen: login -> dashboard -> review queue
   * -> reports -> stories, with the real flows (start review, approve/reject,
   * resolve report). Mock data shape matches src/services/mock/db.js; styling
   * reads like the Ant Design theme in src/theme/antdTheme.js.
   * Single visual world, no dark variant — matches the real app.
   *
   * Open directly in a browser, or publish as an artifact. Not part of the
   * Vite build.
   */
  :root {
    --accent: #5b21b6;
    --accent-hover: #6d28d9;
    --grad-from: #1f1235;
    --sider: #1f1235;
    --sider-ink: rgba(255, 255, 255, 0.72);
    --sider-ink-strong: #fff;
    --sider-active: #5b21b6;
    --app-bg: #f4f5f7;
    --card: #ffffff;
    --card-border: #f0f0f0;
    --line: #eef0f2;
    --ink: rgba(0, 0, 0, 0.88);
    --ink-soft: rgba(0, 0, 0, 0.45);
    --ink-faint: rgba(0, 0, 0, 0.25);
    --field-border: #d9d9d9;
    --danger: #ff4d4f;
    --danger-bg: #fff2f0;
    --danger-border: #ffccc7;
    --ok: #389e0d;
    --ok-bg: #f6ffed;
    --ok-border: #b7eb8f;
    --warn: #d48806;
    --warn-bg: #fffbe6;
    --warn-border: #ffe58f;
    --info: #1677ff;
    --info-bg: #e6f4ff;
    --info-border: #91caff;
    --focus-ring: rgba(91, 33, 182, 0.12);
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--ui);
    font-size: 14px;
    color: var(--ink);
    background: var(--app-bg);
  }
  button { font-family: inherit; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { color: var(--accent-hover); }
  [hidden] { display: none !important; }

  /* ---------- login ---------- */
  #login {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1200px 800px at 78% 12%, rgba(139, 92, 246, 0.35), transparent 60%),
      linear-gradient(135deg, var(--grad-from) 0%, var(--accent) 100%);
  }
  .card-auth {
    width: 380px;
    max-width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand svg { width: 32px; height: 32px; color: var(--accent); }
  .brand h1 { margin: 8px 0 0; font-size: 24px; font-weight: 600; }
  .brand p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
  .field { margin-bottom: 20px; }
  .field label { display: block; margin-bottom: 6px; }
  .field label::before { content: "*"; color: var(--danger); margin-right: 4px; font-family: SimSun, sans-serif; }
  .control {
    display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 4px 11px;
    border: 1px solid var(--field-border); border-radius: var(--radius);
    background: #fff; transition: border-color .2s, box-shadow .2s;
  }
  .control:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring); }
  .control svg { width: 15px; height: 15px; color: var(--ink-faint); flex: none; }
  .control input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; font: inherit; color: var(--ink); background: transparent; }
  .control input::placeholder { color: var(--ink-faint); }
  .btn {
    height: 32px; padding: 0 15px; border: 1px solid var(--field-border);
    border-radius: var(--radius); background: #fff; color: var(--ink);
    cursor: pointer; font-size: 14px; transition: all .2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn[disabled]:hover { color: var(--ink); border-color: var(--field-border); }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn--danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn--danger:hover { background: #ff7875; border-color: #ff7875; color: #fff; }
  .btn--block { width: 100%; display: flex; }
  .btn--sm { height: 26px; padding: 0 10px; font-size: 13px; }
  .hint { margin: 4px 0 0; text-align: center; font-size: 12px; color: var(--ink-soft); }
  .hint code { font-family: var(--mono); font-size: .9em; padding: .12em .4em; border-radius: 4px; background: rgba(120,90,170,.1); border: 1px solid rgba(100,70,150,.18); }
  .alert {
    display: flex; gap: 8px; padding: 8px 12px; border-radius: var(--radius);
    background: var(--danger-bg); border: 1px solid var(--danger-border);
    color: var(--ink); font-size: 14px; margin-bottom: 16px;
  }
  .alert svg { width: 16px; height: 16px; color: var(--danger); flex: none; margin-top: 2px; }

  /* ---------- app shell ---------- */
  #app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
  #sider {
    background: var(--sider); color: var(--sider-ink);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  #sider .logo {
    height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    color: #fff; font-weight: 700; letter-spacing: .3px; font-size: 15px;
  }
  #sider .logo svg { width: 20px; height: 20px; }
  #sider nav { padding: 8px 0; display: flex; flex-direction: column; }
  .navlink {
    display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 24px;
    color: var(--sider-ink); font-size: 14px; cursor: pointer; border: 0; background: none; text-align: left;
    transition: background .15s, color .15s;
  }
  .navlink svg { width: 16px; height: 16px; }
  .navlink:hover { color: var(--sider-ink-strong); }
  .navlink.active { background: var(--sider-active); color: #fff; }
  #main { display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 56px; background: #fff; border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; gap: 10px;
  }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: #ede9fe; color: var(--accent); display: grid; place-items: center; }
  .avatar svg { width: 14px; height: 14px; }
  #userbtn { display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; color: var(--ink); font-size: 14px; }
  #view { padding: 20px; flex: 1; }

  /* ---------- page primitives ---------- */
  .page-head { margin-bottom: 16px; }
  .crumb { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  .crumb a { color: var(--ink-soft); }
  .crumb a:hover { color: var(--accent); }
  .page-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .page-head h2 { margin: 0; font-size: 22px; font-weight: 600; }
  .page-head .sub { margin: 2px 0 0; color: var(--ink-soft); }
  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  }
  .card > .card-title {
    padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .card > .card-body { padding: 16px; }
  .grid { display: grid; gap: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 18px 20px; cursor: pointer; transition: box-shadow .2s, transform .05s;
  }
  .stat:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .stat .k { font-size: 14px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .stat .k svg { width: 14px; height: 14px; }
  .stat .v { font-size: 26px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #fafafa; color: var(--ink);
    font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafaff; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .table-wrap { overflow-x: auto; }

  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; line-height: 20px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .tag--default { background: #fafafa; border-color: #d9d9d9; color: var(--ink-soft); }
  .tag--ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .tag--info { background: var(--info-bg); border-color: var(--info-border); color: var(--info); }
  .tag--warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
  .tag--err { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
  .tag--purple { background: #f9f0ff; border-color: #d3adf7; color: #722ed1; }
  .tag--gold { background: #fffbe6; border-color: #ffe58f; color: #d48806; }
  .tag--cyan { background: #e6fffb; border-color: #87e8de; color: #08979c; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: #f0f0f0; border-radius: var(--radius); padding: 2px; }
  .seg button {
    border: 0; background: none; padding: 3px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--ink-soft);
  }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  select, .inp {
    height: 30px; border: 1px solid var(--field-border); border-radius: var(--radius);
    padding: 0 10px; font: inherit; color: var(--ink); background: #fff;
  }
  .inp { width: 220px; }

  .cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--ink-soft); }
  .kv dd { margin: 0; }
  .reader {
    max-height: 420px; overflow: auto; padding: 16px; background: #fafafa;
    border: 1px solid var(--line); border-radius: var(--radius); white-space: pre-wrap; line-height: 1.7;
  }
  .cover { width: 96px; height: 128px; object-fit: cover; border-radius: 6px; background: #eee; flex: none; }
  .cover--sm { width: 32px; height: 44px; border-radius: 4px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 16px 18px; }
  .timeline li::before { content: ""; position: absolute; left: 0; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .timeline li::after { content: ""; position: absolute; left: 3.5px; top: 12px; bottom: 0; width: 1px; background: var(--line); }
  .timeline li:last-child::after { display: none; }
  .timeline .t-action { font-weight: 600; }
  .timeline .t-meta { color: var(--ink-soft); font-size: 12px; }

  /* modal + drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { width: 440px; max-width: 100%; background: #fff; border-radius: var(--radius); padding: 20px; box-shadow: 0 12px 48px rgba(0,0,0,.2); }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal textarea { width: 100%; min-height: 90px; border: 1px solid var(--field-border); border-radius: var(--radius); padding: 8px 11px; font: inherit; resize: vertical; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .drawer-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw; background: #fff; z-index: 51; display: flex; flex-direction: column; box-shadow: -6px 0 24px rgba(0,0,0,.12); }
  .drawer header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .drawer .drawer-body { padding: 20px; overflow: auto; }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 80;
    background: #fff; border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 8px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.14); display: flex; align-items: center; gap: 8px; font-size: 14px;
  }
  .toast svg { width: 16px; height: 16px; color: var(--ok); }

  .result { text-align: center; padding: 32px 16px; color: var(--ink-soft); }
  .result svg { width: 40px; height: 40px; color: var(--ok); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 880px) {
    #app { grid-template-columns: 0 1fr; }
    #sider { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    #sider.open { transform: none; }
    .cols { grid-template-columns: 1fr; }
  }
</style>

    back: '<path d="M872 474H286.9l219.9-176.7c9.4-7.5 10.9-21.3 3.3-30.7L471 231.5c-7.6-9.4-21.4-10.9-30.8-3.3L142.5 476.2c-9.4 7.5-9.4 21.8 0 29.3l297.7 248c9.4 7.5 23.2 6 30.8-3.3l39.1-48.6c7.6-9.4 6.1-23.2-3.3-30.7L286.9 550H872c11.6 0 21-9.4 21-21v-34c0-11.6-9.4-21-21-21z"/>',
  };
  const svg = (p, cls) => '<svg class="' + (cls || '') + '" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true">' + p + '</svg>';

  // ---------- mock data (shape mirrors src/services/mock/db.js) ----------
  const AUTHORS = ["Mặc Hương Đồng Khứu", "Nhĩ Căn", "Thiên Tằm Thổ Đậu", "Vong Ngữ", "Cố Mạn", "Đường Gia Tam Thiếu"];
  const GENRES = ["Huyền Huyễn", "Tiên Hiệp", "Đô Thị", "Kiếm Hiệp", "Ngôn Tình", "Xuyên Không"];
  const LOREM = ("Ngày ấy, khi ánh trăng phủ lên đỉnh Thiên Sơn, hắn đứng lặng nhìn về phương xa. " +
    "Con đường tu luyện phía trước còn dài, nhưng trong lòng hắn đã không còn do dự. " +
    "Một hơi thở, một niệm đầu, thiên địa như thu vào lòng bàn tay. ").repeat(14);
  const now = Date.now(), DAY = 86400000;
  const ago = (d) => new Date(now - d * DAY);
  const fmt = (dt) => !dt ? "—" : new Date(dt).toISOString().slice(0, 16).replace("T", " ");
  const fmtD = (dt) => !dt ? "—" : new Date(dt).toISOString().slice(0, 10);
  const rel = (dt) => { const s = (now - new Date(dt).getTime()) / DAY; return s < 1 ? "today" : Math.round(s) + "d ago"; };
  const compact = (n) => Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n);

  const ST_STATUS = ["Ongoing", "Ongoing", "Completed", "Hiatus", "Draft", "Dropped", "Ongoing", "Completed", "Ongoing", "Hiatus", "Completed", "Ongoing"];
  const stories = Array.from({ length: 12 }, (_, i) => {
    const n = i + 1, status = ST_STATUS[i];
    return {
      publicId: "st-" + String(n).padStart(4, "0"),
      title: ["Nghịch Thiên Tà Thần", "Vạn Cổ Thần Vương", "Đấu Phá Thương Khung", "Thần Ấn Vương Tọa", "Tuyệt Thế Đường Môn", "Ma Đạo Tổ Sư", "Tinh Thần Biến", "Cửu Tinh Thiên Thần Quyết", "Già Thiên", "Hoàn Mỹ Thế Giới", "Thánh Khư", "Tru Tiên"][i],
      description: "Một thiếu niên bình phàm vô tình có được truyền thừa thượng cổ, từ đó bước lên con đường nghịch thiên cải mệnh, tranh phong với thiên kiêu vạn tộc, đạp lên đỉnh phong của thế giới tu luyện.",
      coverImageUrl: "https://picsum.photos/seed/sv" + n + "/120/160",
      status, authorName: AUTHORS[i % AUTHORS.length], language: "vi",
      ageRating: i % 5 === 0 ? "Mature" : "General",
      viewCount: 12000 + i * 48000 + (i % 3) * 90000, followCount: 800 + i * 2600,
      ratingAvg: (3.9 + (i % 5) * 0.22).toFixed(1), ratingCount: 40 + i * 210,
      genres: [GENRES[i % GENRES.length], GENRES[(i + 2) % GENRES.length]],
      tags: ["trọng sinh", "hệ thống", "sủng"].slice(0, 2 + (i % 2)),
      chapterCount: 12 + i * 63, publishedAt: status === "Draft" ? null : ago(30 + i * 4), createdAt: ago(50 + i * 4),
    };
  });
  const S = (id) => stories.find((s) => s.publicId === id);

  const RV_STATUS = ["Pending", "Pending", "Reviewing", "Pending", "Approved", "Pending", "Rejected", "Pending", "Reviewing", "Pending"];
  const reviewItems = Array.from({ length: 10 }, (_, i) => {
    const n = i + 1, isChapter = i % 3 === 1, st = RV_STATUS[i], story = stories[i % stories.length];
    const hist = [{ at: ago(i + 2), actor: isChapter ? story.title : story.authorName, action: "Submitted", note: "Author submitted for review." }];
    if (st !== "Pending") hist.push({ at: ago(i + 1), actor: "Platform Admin", action: "Started review", note: null });
    if (st === "Approved") hist.push({ at: ago(i), actor: "Platform Admin", action: "Approved & published", note: "Meets content guidelines." });
    if (st === "Rejected") hist.push({ at: ago(i), actor: "Platform Admin", action: "Rejected", note: "Missing primary genre; formatting issues in chapter 1." });
    return {
      id: "rv-" + String(n).padStart(4, "0"),
      targetType: isChapter ? "Chapter" : "Story",
      title: isChapter ? story.title + " — Chương " + (100 + n) + ": Đột phá" : story.title,
      authorName: story.authorName,
      genres: isChapter ? [] : story.genres,
      submittedAt: ago(i + 2), reviewStatus: st,
      assignedTo: st === "Pending" ? null : "Platform Admin",
      decisionReason: st === "Rejected" ? "Missing primary genre; formatting issues in chapter 1." : st === "Approved" ? "Meets content guidelines." : null,
      story, isChapter,
      chapter: isChapter ? { title: "Chương " + (100 + n) + ": Đột phá", orderIndex: 100 + n, wordCount: 2400 + i * 180, status: "Draft", content: LOREM } : null,
      history: hist,
    };
  });
  const RV = (id) => reviewItems.find((r) => r.id === id);

  const RP_STATUS = ["Pending", "Pending", "Reviewing", "Pending", "Resolved", "Pending", "Dismissed", "Pending", "Reviewing", "Pending"];
  const REASONS = ["Copyright", "Inappropriate", "Spam", "Other"];
  const READERS = ["reader_an", "linh_reader", "bao_ngoc", "tuan.pham", "mai_2k1", "hoang_dev"];
  const NOTES = [
    "This chapter is copied word-for-word from another site.",
    "Contains explicit content not marked as Mature.",
    "Spam links in the author's note.",
    "Harassment in the comment thread.",
    "Wrong genre, misleading tags.",
  ];
  const reports = Array.from({ length: 10 }, (_, i) => {
    const n = i + 1, tt = ["Story", "Chapter", "Comment"][i % 3], story = stories[i % stories.length];
    const reason = REASONS[i % REASONS.length], st = RP_STATUS[i];
    const action = st === "Resolved" ? ["Warn", "Hide", "Remove"][i % 3] : st === "Dismissed" ? "Dismiss" : null;
    const hist = [{ at: ago(i + 1), actor: READERS[i % READERS.length], action: "Reported", note: null }];
    if (st !== "Pending") hist.push({ at: ago(i), actor: "Content Moderator", action: "Picked up", note: null });
    if (action) hist.push({ at: ago(i), actor: "Content Moderator", action, note: st === "Dismissed" ? "No violation found." : "Violation confirmed." });
    return {
      id: "rp-" + String(n).padStart(4, "0"), targetType: tt,
      targetTitle: tt === "Comment" ? 'Comment on "' + story.title + '"' : tt === "Chapter" ? story.title + " — Chương " + (20 + n) : story.title,
      reason, reporterName: READERS[i % READERS.length], note: NOTES[i % NOTES.length],
      status: st, action, resolutionNote: action ? (st === "Dismissed" ? "No violation found." : "Action applied per moderation guidelines.") : null,
      createdAt: ago(i + 1), story: tt === "Comment" ? null : story, history: hist,
    };
  });
  const RP = (id) => reports.find((r) => r.id === id);

  // ---------- tag helpers ----------
  const TAGCLS = {
    Draft: "default", Ongoing: "info", Completed: "ok", Hiatus: "warn", Dropped: "err",
    Scheduled: "cyan", Published: "ok", Removed: "err",
    Pending: "gold", Reviewing: "info", Approved: "ok", Rejected: "err",
    Resolved: "ok", Dismissed: "default",
    Copyright: "err", Inappropriate: "err", Spam: "warn", Other: "default",
    Warn: "gold", Hide: "warn", Remove: "err", Dismiss: "default",
  };
  const tag = (v) => v ? '<span class="tag tag--' + (TAGCLS[v] || "default") + '">' + v + "</span>" : '<span class="muted">—</span>';

  // ---------- app state ----------
  const nav = [
    { key: "dashboard", label: "Dashboard", icon: I.dashboard },
    { key: "review", label: "Review queue", icon: I.review },
    { key: "reports", label: "Reports", icon: I.flag },
    { key: "stories", label: "Stories", icon: I.book },
  ];
  let current = { view: "dashboard", param: null };
  let reviewFilter = "Pending";
  let reportFilter = "Pending";
  let storyFilter = "all";

  const el = (id) => document.getElementById(id);
  const view = () => el("view");
  const overlays = () => el("overlays");

  // ---------- login ----------
  el("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = el("l-email").value.trim().toLowerCase();
    const pass = el("l-pass").value;
    const err = el("login-error");
    if (email === "admin@storyverse.local" && pass === "admin123") {
      err.hidden = true;
      el("login").hidden = true;
      el("app").hidden = false;
      go("dashboard");
    } else {
      el("login-error-msg").textContent = pass ? "Invalid email or password." : "Enter your password.";
      err.hidden = false;
    }
  });

    el("app").hidden = true;
    el("login").hidden = false;
    el("l-pass").value = "";
  });

  // ---------- nav ----------
  function renderNav() {
    el("nav").innerHTML = nav.map((n) =>
      '<button class="navlink' + (current.view === n.key ? " active" : "") + '" data-key="' + n.key + '">' +
      svg(n.icon) + "<span>" + n.label + "</span></button>"
    ).join("");
    el("nav").querySelectorAll(".navlink").forEach((b) =>
      b.addEventListener("click", () => go(b.dataset.key))
    );
  }
  function go(v, param) {
    current = { view: v, param: param || null };
    renderNav();
    window.scrollTo(0, 0);
    RENDER[v] ? RENDER[v](param) : RENDER.dashboard();
  }

  // ---------- toast ----------
  let toastT;
  function toast(msg) {
    clearTimeout(toastT);
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.innerHTML = svg(I.ok) + "<span>" + msg + "</span>";
    toastT = setTimeout(() => t.remove(), 2200);
  }

  // ---------- shared bits ----------
  const head = (title, sub, crumb, extra) =>

    (crumb ? '<div class="crumb">' + crumb + "</div>" : "") +
    '<div class="row"><div><h2>' + title + "</h2>" + (sub ? '<p class="sub">' + sub + "</p>" : "") + "</div>" +
    (extra ? "<div>" + extra + "</div>" : "") + "</div></div>";

  const timeline = (items) => '<ul class="timeline">' + items.map((h) =>
    '<li><div class="t-action">' + h.action + '</div><div class="t-meta">' + h.actor + " · " + fmt(h.at) + "</div>" +

    const stat = (k, val, icon, color, to) =>
      '<div class="stat" data-to="' + to + '"><div class="k">' + svg(icon) + k + '</div>' +
      '<div class="v" style="color:' + color + '">' + val + "</div></div>";

      head("Dashboard", "Overview of the review and moderation workload") +
      '<div class="grid" style="grid-template-columns:repeat(4,1fr)">' +

        stat("In review", c(reviewItems, "reviewStatus", "Reviewing"), I.ok, "#1677ff", "review") +

        stat("Total stories", stories.length, I.book, "#5b21b6", "stories") +
      "</div>" +
      '<div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:16px">' +
        '<div class="card"><div class="card-title">Recent submissions<a data-to="review">View all</a></div><div class="table-wrap">' +
          tableEl(["Title", "Type", "Status", "Submitted"], reviewItems.slice(0, 5).map((r) => ({
            _click: () => go("review-detail", r.id),
            cells: ['<a>' + r.title + "</a>", r.targetType, tag(r.reviewStatus), '<span class="muted small">' + rel(r.submittedAt) + "</span>"],
          }))) +
        "</div></div>" +
        '<div class="card"><div class="card-title">Latest reports<a data-to="reports">View all</a></div><div class="card-body stack">' +
          reports.slice(0, 5).map((r) =>
            '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center" data-report="' + r.id + '">' +
            "<div><a>" + r.targetTitle + "</a><div class=\"small muted\">" + tag(r.reason) + " · " + rel(r.createdAt) + "</div></div>" +
            tag(r.status) + "</div>"

        "</div></div>" +
      "</div>";

  function tableEl(cols, rows) {

  RENDER.review = function () {
    const list = reviewFilter === "all" ? reviewItems : reviewItems.filter((r) => r.reviewStatus === reviewFilter);
    const rows = list.map((r) => ({
      _click: () => go("review-detail", r.id),

        '<a>' + r.title + "</a>", r.targetType, r.authorName || "—",

      head("Review queue", "Stories and chapters submitted by authors, awaiting a publish decision") +

        '<div class="seg" id="rv-seg">' +

          ).join("") +
        "</div>" +
        '<input class="inp" placeholder="Search title or author (visual only)" />' +
      "</div><div class=\"table-wrap\">" +
        tableEl(["Title", "Type", "Author", "Submitted", "Status"], rows) +
      "</div><div class=\"card-body small muted\">" + list.length + " items</div></div>";
    bindRows(rows);
    el("rv-seg").querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => { reviewFilter = b.dataset.s; RENDER.review(); })
    );
  };

  RENDER["review-detail"] = function (id) {
    const r = RV(id);
    if (!r) return go("review");
    const canStart = r.reviewStatus === "Pending";
    const canDecide = r.reviewStatus === "Reviewing";
    const s = r.story;
    const content = r.isChapter
      ? '<h3 style="margin:0 0 4px">' + r.chapter.title + "</h3>" +
        '<div class="muted small">Order ' + r.chapter.orderIndex + " · " + compact(r.chapter.wordCount) + " words · " + tag(r.chapter.status) + "</div>" +
        '<div class="reader" style="margin-top:12px">' + r.chapter.content + "</div>"
      : '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
          '<img class="cover" src="' + s.coverImageUrl + '" alt="">' +
          '<div style="flex:1;min-width:220px"><h3 style="margin:0 0 4px">' + s.title + "</h3>" +
          '<div class="muted">by ' + s.authorName + "</div>" +
          '<div class="chips" style="margin-top:8px">' + tag(s.status) +
            s.genres.map((g) => '<span class="tag tag--purple">' + g + "</span>").join("") +
            s.tags.map((t) => '<span class="tag tag--default">#' + t + "</span>").join("") + "</div></div>" +
        "</div>" +
        '<dl class="kv" style="margin-top:16px">' +
          "<dt>Public ID</dt><dd>" + s.publicId + "</dd>" +
          "<dt>Chapters</dt><dd>" + s.chapterCount + "</dd>" +
          "<dt>Views</dt><dd>" + compact(s.viewCount) + "</dd>" +
          "<dt>Rating</dt><dd>" + s.ratingAvg + " (" + compact(s.ratingCount) + ")</dd>" +
          "<dt>Age rating</dt><dd>" + s.ageRating + "</dd>" +
        "</dl>" +
        '<p style="margin-top:16px;white-space:pre-wrap">' + s.description + "</p>";

    view().innerHTML =
      head(r.title, r.targetType + " · submitted by " + (r.authorName || "—"),
        '<a data-back>Review queue</a> / ' + r.id,
        '<button class="btn" data-back>' + svg(I.back) + " Back</button>") +
      '<div class="cols">' +
        '<div class="card"><div class="card-title">' + r.targetType + "</div><div class=\"card-body\">" + content + "</div></div>" +
        "<div class=\"stack\">" +
          '<div class="card"><div class="card-title">Decision</div><div class="card-body stack">' +
            '<dl class="kv">' +
              "<dt>Status</dt><dd>" + tag(r.reviewStatus) + "</dd>" +
              "<dt>Assigned to</dt><dd>" + (r.assignedTo || "—") + "</dd>" +
              "<dt>Submitted</dt><dd>" + fmt(r.submittedAt) + "</dd>" +
            "</dl>" +
            (r.decisionReason ? '<div class="small"><span class="muted">Last decision note:</span><br>' + r.decisionReason + "</div>" : "") +
            '<button class="btn btn--block" data-act="start"' + (canStart ? "" : " disabled") + ">" + svg(I.play) + " Start review</button>" +
            '<button class="btn btn--primary btn--block" data-act="approve"' + (canDecide ? "" : " disabled") + ">" + svg(I.check) + " Approve &amp; publish</button>" +
            '<button class="btn btn--danger btn--block" data-act="reject"' + (canDecide ? "" : " disabled") + ">" + svg(I.close) + " Reject</button>" +
            (!canStart && !canDecide ? '<div class="small muted">This item is already ' + r.reviewStatus.toLowerCase() + ".</div>" : "") +
          "</div></div>" +
          '<div class="card"><div class="card-title">History</div><div class="card-body">' + timeline(r.history) + "</div></div>" +
        "</div>" +
      "</div>";
    view().querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => go("review")));
    view().querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
      const a = b.dataset.act;
      if (a === "start") {
        r.reviewStatus = "Reviewing"; r.assignedTo = "Platform Admin";
        r.history.push({ at: new Date(), actor: "Platform Admin", action: "Started review", note: null });
        toast("Review started"); go("review-detail", id);
      } else if (a === "approve") {
        r.reviewStatus = "Approved"; r.decisionReason = "Meets content guidelines.";
        r.history.push({ at: new Date(), actor: "Platform Admin", action: "Approved & published", note: r.decisionReason });
        toast("Approved & published"); go("review-detail", id);
      } else if (a === "reject") {
        askReason("Reject submission", "Rejection reason", "The author sees this note and can revise and resubmit.", "danger", (reason) => {
          r.reviewStatus = "Rejected"; r.decisionReason = reason;
          r.history.push({ at: new Date(), actor: "Platform Admin", action: "Rejected", note: reason });
          toast("Submission rejected"); go("review-detail", id);
        });
      }
    }));
  };

  RENDER.reports = function () {
    const list = reportFilter === "all" ? reports : reports.filter((r) => r.status === reportFilter);
    const rows = list.map((r) => ({
      _click: () => go("report-detail", r.id),
      cells: [
        r.id,
        '<a>' + r.targetTitle + '</a><div class="small muted">' + r.targetType + "</div>",
        tag(r.reason), r.reporterName,
        '<span class="muted">' + (r.note.length > 64 ? r.note.slice(0, 64) + "…" : r.note) + "</span>",
        fmt(r.createdAt) + '<div class="small muted">' + rel(r.createdAt) + "</div>",
        tag(r.status),
      ],
    }));
    view().innerHTML =
      head("Reports", "User-submitted reports on stories, chapters and comments") +
      '<div class="card"><div class="card-title">' +
        '<div class="seg" id="rp-seg">' +
          ["Pending", "Reviewing", "Resolved", "Dismissed", "all"].map((s) =>
            '<button data-s="' + s + '"' + (reportFilter === s ? ' class="on"' : "") + ">" + (s === "all" ? "All" : s) + "</button>"
          ).join("") +
        "</div>" +
        '<input class="inp" placeholder="Search (visual only)" />' +
      "</div><div class=\"table-wrap\">" +
        tableEl(["ID", "Target", "Reason", "Reporter", "Note", "Created", "Status"], rows) +
      "</div><div class=\"card-body small muted\">" + list.length + " items</div></div>";
    bindRows(rows);
    el("rp-seg").querySelectorAll("button").forEach((b) =>
      b.addEventListener("click", () => { reportFilter = b.dataset.s; RENDER.reports(); })
    );
  };

  RENDER["report-detail"] = function (id) {
    const r = RP(id);
    if (!r) return go("reports");
    const closed = r.status === "Resolved" || r.status === "Dismissed";
    view().innerHTML =
      head("Report " + r.id, r.targetType + " · reported by " + r.reporterName,
        '<a data-back>Reports</a> / ' + r.id,
        '<button class="btn" data-back>' + svg(I.back) + " Back</button>") +
      '<div class="cols">' +
        '<div class="stack">' +
          '<div class="card"><div class="card-title">Report</div><div class="card-body">' +
            '<dl class="kv">' +
              "<dt>Target</dt><dd>" + r.targetTitle + ' <span class="muted">(' + r.targetType + ")</span></dd>" +
              "<dt>Reason</dt><dd>" + tag(r.reason) + "</dd>" +
              "<dt>Reporter</dt><dd>" + r.reporterName + "</dd>" +
              "<dt>Reported at</dt><dd>" + fmt(r.createdAt) + "</dd>" +
              "<dt>Status</dt><dd>" + tag(r.status) + "</dd>" +
              "<dt>Reporter note</dt><dd>" + r.note + "</dd>" +
              (r.action ? "<dt>Action taken</dt><dd>" + tag(r.action) + " — " + r.resolutionNote + "</dd>" : "") +
            "</dl></div></div>" +
            (r.story ? '<div class="card"><div class="card-title">Reported story</div><div class="card-body">' +
              '<div style="display:flex;gap:12px"><img class="cover" src="' + r.story.coverImageUrl + '" alt="">' +
              "<div><strong>" + r.story.title + "</strong><div class=\"muted\">by " + r.story.authorName + "</div>" +
              '<div class="chips" style="margin-top:6px">' + tag(r.story.status) + r.story.genres.map((g) => '<span class="tag tag--purple">' + g + "</span>").join("") + "</div></div></div>" +
              '<p style="margin-top:12px;white-space:pre-wrap">' + r.story.description + "</p></div></div>" : "") +
        "</div>" +
        '<div class="stack">' +
          '<div class="card"><div class="card-title">Resolve</div><div class="card-body stack">' +
            (closed
              ? '<div class="result">' + svg(I.ok) + "<div>This report is " + r.status.toLowerCase() + ".</div></div>"
              : (r.status === "Pending" ? '<button class="btn btn--block" data-act="pickup">Pick up (start reviewing)</button>' : "") +
                '<label class="muted small">Moderation action</label>' +
                '<select id="mod-action"><option value="">Choose an action</option>' +
                  ["Dismiss", "Warn", "Hide", "Remove"].map((a) => '<option value="' + a + '">' + a + "</option>").join("") +
                "</select>" +
                '<label class="muted small">Resolution note</label>' +
                '<textarea id="mod-note" class="inp" style="width:100%;height:80px;padding:8px 11px" placeholder="Explain the decision — kept in the audit history."></textarea>' +
                '<button class="btn btn--primary btn--block" data-act="resolve">Apply &amp; resolve</button>'
            ) +
          "</div></div>" +
          '<div class="card"><div class="card-title">History</div><div class="card-body">' + timeline(r.history) + "</div></div>" +
        "</div>" +
      "</div>";
    view().querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => go("reports")));
    const act = view().querySelector('[data-act="pickup"]');
    if (act) act.addEventListener("click", () => {
      r.status = "Reviewing";
      r.history.push({ at: new Date(), actor: "Content Moderator", action: "Picked up", note: null });
      toast("Report moved to Reviewing"); go("report-detail", id);
    });
    const res = view().querySelector('[data-act="resolve"]');
    if (res) res.addEventListener("click", () => {
      const a = el("mod-action").value, note = el("mod-note").value.trim();
      if (!a) return toast("Choose a moderation action.");
      if (a !== "Dismiss" && !note) return toast("A resolution note is required.");
      r.action = a; r.status = a === "Dismiss" ? "Dismissed" : "Resolved";
      r.resolutionNote = note || "No violation found.";
      r.history.push({ at: new Date(), actor: "Content Moderator", action: a, note: r.resolutionNote });
      toast(a === "Dismiss" ? "Report dismissed" : "Report resolved"); go("report-detail", id);
    });
  };

  RENDER.stories = function () {
    const list = storyFilter === "all" ? stories : stories.filter((s) => s.status === storyFilter);
    const rows = list.map((s) => ({
      _click: () => openDrawer(s),
      cells: [
        '<div style="display:flex;gap:10px;align-items:center"><img class="cover cover--sm" src="' + s.coverImageUrl + '" alt="">' +
          "<div><a>" + s.title + '</a><div class="small muted">' + s.authorName + "</div></div></div>",
        tag(s.status), s.genres.join(", "),
        '<span class="num">' + s.chapterCount + "</span>",
        '<span class="num">' + compact(s.viewCount) + "</span>",
        '<span class="num">' + s.ratingAvg + " (" + compact(s.ratingCount) + ")</span>",
        fmtD(s.publishedAt),
      ],
    }));
    view().innerHTML =
      head("Stories", "Every story on the platform, across all lifecycle states") +
      '<div class="card"><div class="card-title">' +
        '<select id="st-filter">' +
          ['<option value="all">All statuses</option>'].concat(
            ["Draft", "Ongoing", "Completed", "Hiatus", "Dropped"].map((s) =>
              '<option value="' + s + '"' + (storyFilter === s ? " selected" : "") + ">" + s + "</option>")
          ).join("") +
        "</select>" +
        '<input class="inp" placeholder="Search title or author (visual only)" />' +
      "</div><div class=\"table-wrap\">" +
        tableEl(["Story", "Status", "Genres", "Chapters", "Views", "Rating", "Published"], rows) +
      "</div><div class=\"card-body small muted\">" + list.length + " stories</div></div>";
    bindRows(rows);
    el("st-filter").addEventListener("change", (e) => { storyFilter = e.target.value; RENDER.stories(); });
  };

  // ---------- drawer / modal ----------
  function openDrawer(s) {
    overlays().innerHTML =
      '<div class="drawer-scrim" data-x></div>' +
      '<aside class="drawer"><header>' + s.title + '<button class="btn btn--sm" data-x>Close</button></header>' +
      '<div class="drawer-body">' +
        '<div style="display:flex;gap:16px;flex-wrap:wrap"><img class="cover" src="' + s.coverImageUrl + '" alt="">' +
        '<div style="flex:1;min-width:200px"><h3 style="margin:0 0 4px">' + s.title + "</h3>" +
        '<div class="muted">by ' + s.authorName + "</div>" +
        '<div class="chips" style="margin-top:8px">' + tag(s.status) + '<span class="tag tag--default">' + s.ageRating + "</span>" +
          s.genres.map((g) => '<span class="tag tag--purple">' + g + "</span>").join("") +
          s.tags.map((t) => '<span class="tag tag--default">#' + t + "</span>").join("") + "</div></div></div>" +
        '<dl class="kv" style="margin-top:16px">' +
          "<dt>Public ID</dt><dd>" + s.publicId + "</dd>" +
          "<dt>Language</dt><dd>" + s.language + "</dd>" +
          "<dt>Chapters</dt><dd>" + s.chapterCount + "</dd>" +
          "<dt>Views</dt><dd>" + compact(s.viewCount) + "</dd>" +
          "<dt>Follows</dt><dd>" + compact(s.followCount) + "</dd>" +
          "<dt>Rating</dt><dd>" + s.ratingAvg + " (" + compact(s.ratingCount) + ")</dd>" +
          "<dt>Created</dt><dd>" + fmtD(s.createdAt) + "</dd>" +
          "<dt>Published</dt><dd>" + fmtD(s.publishedAt) + "</dd>" +
        "</dl>" +
        '<h4 style="margin:16px 0 6px">Description</h4><p style="white-space:pre-wrap;margin:0">' + s.description + "</p>" +
      "</div></aside>";
    overlays().querySelectorAll("[data-x]").forEach((n) => n.addEventListener("click", () => (overlays().innerHTML = "")));
  }

  function askReason(title, label, desc, kind, onOk) {
    overlays().innerHTML =
      '<div class="scrim" data-x><div class="modal" data-stop>' +
        "<h3>" + title + "</h3>" +
        '<p class="small muted" style="margin:0 0 10px">' + desc + "</p>" +
        '<label class="small" style="display:block;margin-bottom:6px">' + label + ' <span style="color:var(--danger)">*</span></label>' +
        '<textarea id="reason-in" placeholder="Kept in the review history."></textarea>' +
        '<div class="actions"><button class="btn" data-x>Cancel</button>' +
        '<button class="btn btn--' + (kind === "danger" ? "danger" : "primary") + '" id="reason-ok">' + (kind === "danger" ? "Reject" : "Confirm") + "</button></div>" +
      "</div></div>";
    const close = () => (overlays().innerHTML = "");
    overlays().querySelectorAll("[data-x]").forEach((n) => n.addEventListener("click", (e) => { if (e.target === n) close(); }));
    overlays().querySelector("[data-stop]").addEventListener("click", (e) => e.stopPropagation());
    el("reason-ok").addEventListener("click", () => {
      const v = el("reason-in").value.trim();
      if (!v) { el("reason-in").style.borderColor = "var(--danger)"; return; }
      close(); onOk(v);
    });
  }

  // ---------- boot ----------
  renderNav();
})();
</script>
